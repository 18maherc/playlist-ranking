<!-- prettier-ignore -->
{% extends "base.html" %}
<!-- prettier-ignore -->
{% block title %}Game - Playlist Ranker{% endblock %}
<!-- prettier-ignore -->
{% block header %}
<script>
	function songSelection(choice) {
		const formData = new FormData();
		formData.append("data", choice);
		fetch("/song-selection", {
			method: "POST",
			body: formData,
		})
			.then((response) => response.json())
			.then((data) => {
				document.querySelectorAll(".song-btn")[0].textContent = data.song_tuple[0];
				document.querySelectorAll(".song-btn")[1].textContent = data.song_tuple[1];
			});
	}
	function showH2H() {
		const button = document.getElementById("start-btn");
		const h2hDiv = document.getElementById("h2h-div");
		button.style.display = "none";
		h2hDiv.style.display = "block";
		fetch("/create-matchup", { method: "POST" })
			.then((response) => response.json())
			.then((data) => {
				document.querySelectorAll(".song-btn")[0].textContent = data.song_tuple[0];
				document.querySelectorAll(".song-btn")[1].textContent = data.song_tuple[1];
			});
	}
	function uploadFile(button) {
		const inputID = button.getAttribute("data-input-id");
		document.getElementById(inputID).click();
	}
	function fileSelected(input) {
		const formID = input.getAttribute("data-form-id");
		document.getElementById(formID).submit();
	}
	function exportFile(exportSelection) {
		const url = `/export-file?selection=${exportSelection}`;
		window.location.href = url;
	}
</script>
<div class="supplement-btns">
	<form id="uploadRecords" action="/upload-records" method="post" enctype="multipart/form-data" style="display: none">
		<input
			id="fileInput1"
			type="file"
			name="file"
			accept=".json"
			data-form-id="uploadRecords"
			onchange="fileSelected(this)"
		/>
	</form>
	<form id="uploadMatchups" action="/upload-matchups" method="post" enctype="multipart/form-data" style="display: none">
		<input
			id="fileInput2"
			type="file"
			name="file"
			accept=".json"
			data-form-id="uploadMatchups"
			onchange="fileSelected(this)"
		/>
	</form>
	<button class="upload-supp-btn" data-input-id="fileInput1" onclick="uploadFile(this)">Upload past records</button>
	<button class="upload-supp-btn" data-input-id="fileInput2" onclick="uploadFile(this)">
		Upload completed matchups
	</button>
</div>
<div class="export-btns">
	<button class="export-btn" onclick="exportFile('records')">Export current records</button>
	<button class="export-btn" onclick="exportFile('matchups')">Export completed matchups</button>
</div>
{% endblock %}
<!-- prettier-ignore -->
{% block content %}
<button id="start-btn" class="start-btn" onclick="showH2H()" style="display: block">Start</button>
<div id="h2h-div" class="head-to-head" style="display: none">
	<p>Which song do you prefer??</p>
	<div class="matchup">
		<button class="song-btn" onclick="songSelection(0)">{{ song_tuple[0] }}</button>
		<span class="center-text">vs.</span>
		<button class="song-btn" onclick="songSelection(1)">{{ song_tuple[1] }}</button>
	</div>
</div>
{% endblock %}
